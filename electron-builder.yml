# Installers in dist/ (npm run dist, on each system): NSIS setup on Windows,
# dmg on macOS, AppImage and deb on Linux. CI builds all of them for releases.
# Everything the app needs is bundled by electron-vite into out/, so no
# node_modules are packaged. The MCP bridge stays outside the asar archive so
# agents can run it (with this app's own executable, ELECTRON_RUN_AS_NODE=1).
appId: io.github.matteofilosa.boar
productName: Boar
copyright: Copyright © 2026 Matteo Filosa
directories:
  output: dist
files:
  - out/**/*
  - resources/icon.ico
  - resources/icon.png
  - package.json
extraResources:
  - from: scripts/boar-mcp.mjs
    to: boar-mcp.mjs
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
  # The speech engine (scripts/build-whisper.sh, or npm run whisper).
  - from: resources/whisper
    to: whisper
npmRebuild: false
# Double-clicking a .boar project opens it in Boar (Windows, macOS, deb; the
# AppImage registers it only through an AppImage integration tool).
fileAssociations:
  - ext: boar
    name: Boar Project
    description: Boar video project
    mimeType: application/x-boar-project
    role: Editor
win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Boar
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  artifactName: Boar-Setup-${version}.exe
  license: LICENSE
# No Apple Developer ID: ad-hoc signature, so macOS asks the user to allow the
# app on first launch (see the README).
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  icon: resources/icon.png
  category: public.app-category.video
  identity: '-'
  hardenedRuntime: false
dmg:
  artifactName: Boar-${version}-${arch}.dmg
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  icon: resources/icon.png
  category: AudioVideo
  executableName: boar
  synopsis: Video editor with a multitrack timeline and local AI tools
  maintainer: Matteo Filosa <67047355+MatteoFilosa@users.noreply.github.com>
appImage:
  artifactName: Boar-${version}-x86_64.AppImage
deb:
  artifactName: Boar-${version}-amd64.deb
